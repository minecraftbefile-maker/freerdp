name: Ubuntu SSH via Cloudflare Quick Tunnel (Password Only)

on:
  workflow_dispatch:

jobs:
  expose-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Server (Password Only)
        run: |
          # 1. Set password for 'runner' user
          # Make sure you have a secret named RUNNER_PASSWORD in your repo settings!
          echo "runner:${{ secrets.RUNNER_PASSWORD }}" | sudo chpasswd

          # 2. Enable Password Authentication in SSH config
          # By default, GitHub runners block password logins. We must force it to 'yes'.
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/g' /etc/ssh/sshd_config
          
          # 3. Restart the SSH service to apply changes
          sudo systemctl restart ssh
          
          echo "✅ SSH server is running with password authentication enabled."

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Quick Tunnel
        run: |
          # Start cloudflared in the background and save logs
          cloudflared tunnel --url ssh://localhost:22 --logfile /tmp/cf.log &
          
          # Wait for the URL to generate
          sleep 10
          
          # Extract the URL from the logs
          URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -n 1)
          
          if [ -z "$URL" ]; then
            echo "❌ Failed to get URL. Here are the logs:"
            cat /tmp/cf.log
            exit 1
          fi
          
          # Extract just the hostname (remove https://)
          HOSTNAME=$(echo $URL | sed 's|https://||')
          
          # Print connection instructions to the GitHub Summary page
          echo "### 🔑 SSH Connection Info" >> $GITHUB_STEP_SUMMARY
          echo "Your Ubuntu runner is live!" >> $GITHUB_STEP_SUMMARY
          echo "Copy and paste this command into your **local terminal**:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "ssh -o ProxyCommand=\"cloudflared access tcp --hostname $HOSTNAME\" runner@localhost" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Password:** Use the password you set in the \`RUNNER_PASSWORD\` secret." >> $GITHUB_STEP_SUMMARY

      - name: Keep job alive
        run: |
          echo "SSH is active. The job will stay alive for 1 hour."
          sleep 3600
